server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devtrace}
    username: ${SPRING_DATASOURCE_USERNAME:devtrace}
    password: ${SPRING_DATASOURCE_PASSWORD:devtrace}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

inventory-service:
  url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

payment-service:
  url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId}]"
    console: "%d{yyyy-MM-dd HH:mm:ss} ${logging.pattern.level} %-40.40logger{39} : %m%n"
