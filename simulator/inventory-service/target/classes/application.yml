server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devtrace}
    username: ${SPRING_DATASOURCE_USERNAME:devtrace}
    password: ${SPRING_DATASOURCE_PASSWORD:devtrace}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
