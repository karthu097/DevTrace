name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './devtrace-ui/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./devtrace-ui
      run: npm ci
      
    - name: Build
      working-directory: ./devtrace-ui
      run: npm run build
      
    - name: Build Docker Image
      if: github.ref == 'refs/heads/main'
      working-directory: ./devtrace-ui
      run: docker build -t devtrace-ui:latest .
